[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200

# crytic-compile (Echidna, Slither) consumes these Foundry artifacts directly via
# --foundry-ignore-compile, so the fuzzer/analyzer never needs its own solc download.
build_info = true
extra_output = ["storageLayout"]

remappings = ["forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64          # intentionally == echidna.yaml seqLen
fail_on_revert = true

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 512
depth = 96

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
